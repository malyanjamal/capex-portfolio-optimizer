[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "capex-portfolio-optimizer"
version = "1.0.0"
description = "Capital investment portfolio optimizer: NPV/IRR appraisal, Monte Carlo risk, and budget-constrained MILP selection on PostgreSQL."
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
